<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Sent Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F6F8;
    --panel: #FFFFFF;
    --ink: #1B2430;
    --muted: #66707C;
    --line: #DCE1E7;
    --accent: #0F5C63;
    --accent-soft: #E3EFEF;
    --danger: #A33A2F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 15px;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }

  .summary {
    background: var(--accent); color: #fff; border-radius: 14px;
    padding: 26px 28px; display: flex; justify-content: space-between;
    align-items: flex-end; flex-wrap: wrap; gap: 16px;
  }
  .summary h1 { margin: 0 0 6px; font-size: 15px; font-weight: 500; opacity: .85; }
  .total {
    font-family: "IBM Plex Serif", Georgia, serif; font-size: clamp(34px, 7vw, 52px);
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 14px; border-radius: 8px; padding: 9px 14px;
    cursor: pointer; border: 1px solid transparent;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid #F2B84B; outline-offset: 2px; }
  .btn-light { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.35); }
  .btn-light:hover { background: rgba(255,255,255,.24); }

  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin-top: 18px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th {
    text-align: left; font-weight: 500; color: var(--muted); font-size: 13px;
    padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  th.num, td.num { text-align: right; }
  th.no-sort { cursor: default; }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  td input {
    width: 100%; font: inherit; color: var(--ink); background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 8px 6px;
  }
  td input:hover { border-color: var(--line); }
  td input:focus { background: var(--accent-soft); border-color: var(--accent); outline: none; }
  td.num input { text-align: right; font-variant-numeric: tabular-nums; }
  .idx { width: 40px; color: var(--muted); font-size: 13px; text-align: center; }
  .del { background: none; color: var(--muted); padding: 6px 10px; }
  .del:hover { color: var(--danger); background: #F8ECEA; }

  .add { margin-top: 12px; background: var(--ink); color: #fff; }
  .add:hover { background: #2C3848; }
  .empty { padding: 36px; text-align: center; color: var(--muted); }
  .foot { margin-top: 14px; color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <section class="summary">
    <div>
      <h1>Total amount sent</h1>
      <div class="total" id="total">₹0</div>
    </div>
    <div class="actions">
      <button class="btn-light" id="exportBtn">Export to CSV</button>
      <button class="btn-light" id="importBtn">Import CSV</button>
      <input type="file" id="fileIn" accept=".csv" class="hidden">
    </div>
  </section>

  <div class="sheet">
    <table>
      <thead>
        <tr>
          <th class="idx no-sort">#</th>
          <th data-sort="name">Name</th>
          <th data-sort="amount" class="num">Amount (₹)</th>
          <th data-sort="date">Date</th>
          <th class="no-sort"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty hidden" id="empty">No transfers yet. Click "Add transfer" to start.</div>
  </div>

  <button class="add" id="addBtn">+ Add transfer</button>
  <p class="foot">Changes save automatically in this browser. Click a column heading to sort.</p>
</div>

<script>
  const KEY = "money-sent-tracker";
  const fmt = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 2 });
  let rows = [];
  let sortState = { key: null, asc: true };

  function load() {
    try { rows = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { rows = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function today() { return new Date().toISOString().slice(0, 10); }

  function updateTotal() {
    const sum = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    document.getElementById("total").textContent = fmt.format(sum);
  }

  function render() {
    const body = document.getElementById("rows");
    body.innerHTML = "";
    rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="idx">${i + 1}</td>
        <td><input type="text" data-f="name" placeholder="Name" aria-label="Name"></td>
        <td class="num"><input type="number" data-f="amount" min="0" step="0.01" placeholder="0" aria-label="Amount"></td>
        <td><input type="date" data-f="date" aria-label="Date"></td>
        <td><button class="del" title="Delete row" aria-label="Delete row">✕</button></td>`;
      tr.querySelectorAll("input").forEach(inp => {
        inp.value = r[inp.dataset.f] ?? "";
        inp.addEventListener("input", () => {
          r[inp.dataset.f] = inp.value;
          save(); updateTotal();
        });
      });
      tr.querySelector(".del").addEventListener("click", () => {
        if (r.name || r.amount) {
          if (!confirm(`Delete the entry for ${r.name || "this row"}?`)) return;
        }
        rows.splice(i, 1); save(); render();
      });
      body.appendChild(tr);
    });
    document.getElementById("empty").classList.toggle("hidden", rows.length > 0);
    updateTotal();
  }

  document.getElementById("addBtn").addEventListener("click", () => {
    rows.push({ name: "", amount: "", date: today() });
    save(); render();
    const inputs = document.querySelectorAll('#rows input[data-f="name"]');
    inputs[inputs.length - 1].focus();
  });

  document.querySelectorAll("th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const k = th.dataset.sort;
      sortState.asc = sortState.key === k ? !sortState.asc : true;
      sortState.key = k;
      rows.sort((a, b) => {
        let x = a[k] || "", y = b[k] || "";
        if (k === "amount") { x = parseFloat(x) || 0; y = parseFloat(y) || 0; }
        else { x = String(x).toLowerCase(); y = String(y).toLowerCase(); }
        return (x > y ? 1 : x < y ? -1 : 0) * (sortState.asc ? 1 : -1);
      });
      save(); render();
    });
  });

  // CSV export
  function csvCell(v) {
    v = String(v ?? "");
    return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }
  document.getElementById("exportBtn").addEventListener("click", () => {
    const lines = [["Name", "Amount", "Date"].join(",")];
    rows.forEach(r => lines.push([r.name, r.amount, r.date].map(csvCell).join(",")));
    const total = rows.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    lines.push(["Total", total, ""].join(","));
    const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `money-sent-${today()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // CSV import
  function parseCSV(text) {
    const out = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); out.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); out.push(row); }
    return out;
  }
  document.getElementById("importBtn").addEventListener("click", () => document.getElementById("fileIn").click());
  document.getElementById("fileIn").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const data = parseCSV(reader.result.replace(/^\ufeff/, ""))
        .slice(1)
        .filter(r => r[0] && r[0].trim().toLowerCase() !== "total")
        .map(r => ({ name: r[0] || "", amount: r[1] || "", date: r[2] || "" }));
      if (rows.length && !confirm("Replace the current entries with the imported file?")) return;
      rows = data; save(); render();
    };
    reader.readAsText(f);
    e.target.value = "";
  });

  load();
  render();
</script>
</body>
</html>
